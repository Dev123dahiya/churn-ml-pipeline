[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-ml-pipeline"
version = "0.1.0"
description = "End-to-end churn model pipeline: validation, training, calibration, cost-based threshold, versioned registry with a promotion gate, and drift monitoring"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["churnml"]
